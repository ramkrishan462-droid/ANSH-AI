<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ANSH AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar" id="sidebar">

        <div class="sidebar-top">

            <div class="brand">
                <div class="brand-logo">✦</div>

                <div>
                    <div class="brand-name">ANSH AI</div>
                    <div class="brand-subtitle">Your AI Assistant</div>
                </div>
            </div>

            <button
                class="close-sidebar"
                id="closeSidebar"
                type="button">
                ×
            </button>

        </div>


        <button
            class="new-chat-btn"
            id="newChat"
            type="button">

            <span>＋</span>
            <span>New Chat</span>

        </button>


        <div class="sidebar-section">

            <div class="section-title">
                Recent Chats
            </div>

            <div
                class="chat-history"
                id="chatHistory">
            </div>

        </div>


        <div class="sidebar-bottom">

            <button
                class="side-button"
                id="clearChat"
                type="button">

                <span>🗑</span>
                Clear Chat

            </button>


            <button
                class="side-button"
                id="themeButton"
                type="button">

                <span>☾</span>
                Theme

            </button>

        </div>

    </aside>


    <div
        class="sidebar-overlay"
        id="sidebarOverlay">
    </div>


    <!-- ================= MAIN ================= -->

    <main class="main">

        <!-- HEADER -->

        <header class="topbar">

            <div class="topbar-left">

                <button
                    class="menu-button"
                    id="menuButton"
                    type="button">
                    ☰
                </button>


                <div class="mobile-brand">
                    <div class="mobile-logo">✦</div>

                    <div>
                        <strong>ANSH AI</strong>
                        <small>AI Assistant</small>
                    </div>
                </div>

            </div>


            <div class="topbar-status">

                <span class="status-dot"></span>

                <span>Online</span>

            </div>

        </header>


        <!-- ================= CHAT ================= -->

        <section
            class="chat-container"
            id="chat">

            <!-- WELCOME -->

            <div
                class="welcome-screen"
                id="welcomeScreen">

                <div class="welcome-glow"></div>

                <div class="welcome-logo">
                    ✦
                </div>

                <h1>
                    Hello, I'm <span>ANSH AI</span>
                </h1>

                <p>
                    Your intelligent AI assistant for
                    chatting, coding and creating images.
                </p>


                <div class="quick-actions">

                    <button
                        class="quick-card"
                        data-prompt="Explain Artificial Intelligence in simple words.">

                        <div class="quick-icon">💡</div>

                        <div>
                            <strong>Ask Anything</strong>
                            <small>Get intelligent answers</small>
                        </div>

                    </button>


                    <button
                        class="quick-card"
                        data-prompt="Write a simple Python program for beginners.">

                        <div class="quick-icon">💻</div>

                        <div>
                            <strong>Write Code</strong>
                            <small>Build something amazing</small>
                        </div>

                    </button>


                    <button
                        class="quick-card"
                        data-image-prompt="A futuristic AI robot standing in a beautiful cyberpunk city">

                        <div class="quick-icon">🎨</div>

                        <div>
                            <strong>Create Image</strong>
                            <small>Turn ideas into images</small>
                        </div>

                    </button>


                    <button
                        class="quick-card"
                        data-prompt="Give me a cool Arduino project idea under 1000 rupees.">

                        <div class="quick-icon">🤖</div>

                        <div>
                            <strong>Get Ideas</strong>
                            <small>Projects & creativity</small>
                        </div>

                    </button>

                </div>

            </div>

        </section>


        <!-- ================= IMAGE PREVIEW ================= -->

        <div
            class="image-preview-area"
            id="imagePreviewArea">

            <div class="image-preview-card">

                <img
                    id="imagePreview"
                    src=""
                    alt="Selected image">

                <div class="image-preview-info">

                    <strong id="imageName">
                        Image
                    </strong>

                    <button
                        id="removeImage"
                        type="button">
                        ×
                    </button>

                </div>

            </div>

        </div>


        <!-- ================= INPUT AREA ================= -->

        <div class="input-area">

            <div class="input-box">

                <textarea
                    id="userInput"
                    placeholder="Message ANSH AI..."
                    rows="1"
                    autocomplete="off">
                </textarea>


                <div class="input-toolbar">

                    <div class="toolbar-left">

                        <!-- IMAGE -->

                        <input
                            type="file"
                            id="imageInput"
                            accept="image/png,image/jpeg,image/webp"
                            hidden>


                        <button
                            class="tool-button"
                            id="imageButton"
                            type="button"
                            title="Upload image">

                            ＋

                        </button>


                        <!-- VOICE -->

                        <button
                            class="tool-button"
                            id="voiceButton"
                            type="button"
                            title="Voice input">

                            🎤

                        </button>

                    </div>


                    <div class="toolbar-right">

                        <span
                            class="character-counter"
                            id="characterCounter">
                            0
                        </span>


                        <button
                            class="send-button"
                            id="sendButton"
                            type="button">

                            ↑

                        </button>

                    </div>

                </div>

            </div>


            <div class="input-hint">

                ANSH AI can make mistakes.
                Check important information.

            </div>

        </div>

    </main>

</div>


<!-- ================= IMAGE CREATION MODAL ================= -->

<div
    class="modal-overlay"
    id="imageModal">

    <div class="image-modal">

        <button
            class="modal-close"
            id="closeImageModal"
            type="button">
            ×
        </button>


        <div class="modal-icon">
            🎨
        </div>


        <h2>
            Create an Image
        </h2>


        <p>
            Describe the image you want ANSH AI to create.
        </p>


        <textarea
            id="imagePrompt"
            placeholder="Example: A futuristic robot walking on Mars, cinematic lighting..."
            rows="4">
        </textarea>


        <div class="image-options">

            <button
                class="image-style active"
                data-style="realistic"
                type="button">
                Realistic
            </button>

            <button
                class="image-style"
                data-style="cinematic"
                type="button">
                Cinematic
            </button>

            <button
                class="image-style"
                data-style="anime"
                type="button">
                Anime
            </button>

            <button
                class="image-style"
                data-style="digital art"
                type="button">
                Digital Art
            </button>

        </div>


        <button
            class="generate-image-button"
            id="generateImageButton"
            type="button">

            <span>✦</span>
            Generate Image

        </button>


        <div
            class="image-generation-status"
            id="imageGenerationStatus">
        </div>

    </div>

</div>


<!-- ================= IMAGE RESULT MODAL ================= -->

<div
    class="modal-overlay"
    id="imageResultModal">

    <div class="image-result-modal">

        <button
            class="modal-close"
            id="closeImageResult"
            type="button">
            ×
        </button>


        <div class="generated-image-container">

            <img
                id="generatedImage"
                src=""
                alt="Generated image">

        </div>


        <div class="generated-image-actions">

            <button
                id="downloadGeneratedImage"
                type="button">

                ↓ Download

            </button>


            <button
                id="newImageButton"
                type="button">

                ✦ Create Another

            </button>

        </div>

    </div>

</div>


<!-- ================= TOAST ================= -->

<div
    class="toast"
    id="toast">
</div>


<script src="script.js"></script>

</body>

</html>
